<!DOCTYPE html>
<html>
  <head>
    <title>Solar City Calculator</title>
    <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin-left: 10%;
      margin-right: 10%;
      margin-top: 16px;
      padding: 0;
    }
    ol {
      font-family: Helvetica neu;
      color: blue;
      font-size: 24px;
}
    div {
      background-color: #aabbff;
      padding: 10px;
      border-radius: 15px;
      margin-right: 5%;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px;
    }
    h1 {
      color: #f50bb7;
    }
    h2 {
      color: #333;
    }
    h3 {
      color: #333;
    }
    p {
      color: #333;
    }
    input[type="text"], input[type="number"] {
      padding: 5px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 5px 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;}
</style>
</head>
<body>
<h1>Setting location parametres</h1>
<h2>Selection of location from the list:</h2>
<ol id="city"></ol>
<form id="cityForm">
<label for="cityNumber">Number of City to search</label>
  <input type="number" id="cityNumberInput" name="cityNumberInput" min="1" max="26" required>
   <button type="submit">RUN</button>
</form>

<p id="demo"></p>

<script src="super_calculator.min.js"></script>
</body>
</html>
